server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # App is built with Vite base=/family/ — accept both prefixed and stripped requests
  location /family/ {
    rewrite ^/family/?(.*)$ /$1 last;
  }

  location = /family {
    return 302 /family/;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
