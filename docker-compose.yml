services:
  family-suite-fe:
    container_name: family-suite-fe
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api/v1}
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
        # Force /family/ for reverse-proxy deploy (ignore local VITE_BASE_PATH=/)
        VITE_BASE_PATH: /family/
    ports:
      - "${HOST_PORT:-8080}:80"
    networks:
      - shared_net
    restart: unless-stopped

networks:
  shared_net:
    external: true
